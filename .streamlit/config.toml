# Field-in-daylight palette: chalk, ink, turf (gains), challenge-flag red (losses).
[theme]
font = "Barlow:https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap, sans-serif"
headingFont = "'Barlow Condensed':https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap, sans-serif"
baseRadius = "small"
showSidebarBorder = true

[theme.light]
primaryColor = "#1E6B43"
backgroundColor = "#F6F7F4"
secondaryBackgroundColor = "#E9EDE6"
textColor = "#16211B"
borderColor = "#C9CFC7"

[theme.dark]
primaryColor = "#52B47F"
backgroundColor = "#0F1813"
secondaryBackgroundColor = "#17241C"
textColor = "#E6ECE6"
borderColor = "#2C3B31"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"  # never show users a stack trace

[browser]
gatherUsageStats = false
